services:
  digital-trade-frontend:
    image: ${DOCKERHUB_USERNAME}/digital-trade-frontend:${VERSION:-latest}
    container_name: digital-trade-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${BACKEND_URL}
      - NEXT_PUBLIC_APP_URL=${FRONTEND_URL}
      - NEXT_PUBLIC_APP_NAME=${APP_NAME:-SwanTradeCapital}
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
