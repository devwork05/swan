version: "3.8"

services:
  postgres:
    container_name: postgres-sql-firm
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - firm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  firm-api:
    container_name: firm-api
    image: ${DOCKERHUB_USERNAME}/digital-trade-api:${APP_VERSION}
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      EMAIL_HOSTNAME: ${EMAIL_HOSTNAME}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      CLOUDINARY_APIKEY: ${CLOUDINARY_APIKEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      JJWT_SECRET: ${JJWT_SECRET}
      CRYPTO_PRICE_API: ${CRYPTO_PRICE_API}
      JAVA_TOOL_OPTIONS: "-Dio.netty.noNative=true -Dreactor.netty.http.client.enableHttp3=false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - firm-network
    restart: unless-stopped

    # Security settings for non-Alpine
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    # For Debian-based, /tmp should work fine
    tmpfs:
      - /tmp:exec,size=256M,mode=1777
      - /run:exec,size=64M,mode=1777
    volumes:
      - firm_logs:/app/logs
      - /dev/shm:/dev/shm:rw

networks:
  firm-network:
    driver: bridge

volumes:
  firm_logs:
    driver: local
  postgres:
    driver: local
