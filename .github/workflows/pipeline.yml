name: Frontend CI/CD Pipeline

on:
  push:
    branches: 
        - main
    paths:
      - 'src/**'
      - 'public/**'
      - '*.json'
      - '*.ts'
      - '*.mjs'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/*.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
      #   run: npm test

      - name: Build
        run: npm run build

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project version
        id: extract_version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-trade-frontend:${{ steps.extract_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-trade-frontend:latest
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ secrets.APP_NAME }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.BACKEND_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.FRONTEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          echo "IdentitiesOnly yes" >> ~/.ssh/config

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment folder on server
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/vps_key \
              -p ${{ secrets.VPS_SSH_PORT }} \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} \
              "mkdir -p digital-trade-frontend"

      - name: Copy docker-compose file to server
        run: |
          scp -o IdentitiesOnly=yes -i ~/.ssh/vps_key \
              -P ${{ secrets.VPS_SSH_PORT }} \
              docker-compose.yml \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:digital-trade-frontend/docker-compose.yml

      - name: Extract project version
        id: extract_version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create environment file on server
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/vps_key \
              -p ${{ secrets.VPS_SSH_PORT }} \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
          cat > digital-trade-frontend/.env << 'EOL'
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          VERSION=${{ steps.extract_version.outputs.VERSION }}

          APP_NAME=${{ secrets.APP_NAME }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}

          DOCKERHUB_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}
          EOL
          EOF

      - name: Deploy to VPS
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/vps_key \
              -p ${{ secrets.VPS_SSH_PORT }} \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
          cd digital-trade-frontend
          echo "Deploying version ${{ steps.extract_version.outputs.VERSION }}"
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/digital-trade-frontend:${{ steps.extract_version.outputs.VERSION }}
          docker compose up -d --pull always
          docker image prune -af
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
          EOF

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check application health
        run: |
          sleep 45
          for i in {1..5}; do
            echo "Health check attempt $i..."
            if curl -f -s -o /dev/null -w "%{http_code}" \
               --max-time 30 \
               http://${{ secrets.VPS_IP }}:3000; then
              echo "Health check passed"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 5 attempts"
          exit 1
