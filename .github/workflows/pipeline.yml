name: Backend API Pipeline

on:
  push:
    branches:
      - backend
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/*.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    name: Compile project
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compile project
        run: mvn clean compile -DskipTests

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
            restore-keys: ${{ runner.os }}-m2-

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ${{ secrets.SPRING_DATASOURCE_USERNAME }} 2>/dev/null; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL to be ready... attempt $i"
            sleep 2
          done

      - name: Running Unit Tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test_db
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          POSTGRES_DB_NAME: test_db
          SPRING_PROFILES_ACTIVE: dev
          EMAIL_HOSTNAME: ${{ secrets.EMAIL_HOSTNAME }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CLOUDINARY_APIKEY: ${{ secrets.CLOUDINARY_APIKEY }}
          CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          JJWT_SECRET: ${{ secrets.JJWT_SECRET }}
          CRYPTO_PRICE_API: ${{ secrets.CRYPTO_PRICE_API }}

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [compile, unit-tests]
    outputs:
      app_version: ${{ steps.extract_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project version
        id: extract_version
        run: |
          echo "VERSION=$(mvn -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-trade-api:${{ steps.extract_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-trade-api:latest
          build-args: |
            PROFILE=prod
            APP_VERSION=${{ steps.extract_version.outputs.VERSION }}

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          echo "IdentitiesOnly yes" >> ~/.ssh/config

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment folder on server
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/vps_key \
              -p ${{ secrets.VPS_SSH_PORT }} \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} \
              "mkdir -p digital-trade-backend"

      - name: Copy docker-compose file to server
        run: |
          scp -o IdentitiesOnly=yes -i ~/.ssh/vps_key \
           -P ${{ secrets.VPS_SSH_PORT }} \
           docker-compose.yml \
           ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:digital-trade-backend/docker-compose.yml

      - name: Create environment file on server
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/vps_key \
          -p ${{ secrets.VPS_SSH_PORT }} \
          ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
          cat > digital-trade-backend/.env << 'EOL'
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          POSTGRES_DB_NAME=${{ secrets.POSTGRES_DB_NAME }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          EMAIL_HOSTNAME=${{ secrets.EMAIL_HOSTNAME }}
          EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          APP_VERSION=${{ needs.build-image.outputs.app_version }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          CLOUDINARY_APIKEY=${{ secrets.CLOUDINARY_APIKEY }}
          CLOUDINARY_SECRET=${{ secrets.CLOUDINARY_SECRET }}
          CLOUDINARY_NAME=${{ secrets.CLOUDINARY_NAME }}
          JJWT_SECRET=${{ secrets.JJWT_SECRET }}
          CRYPTO_PRICE_API=${{ secrets.CRYPTO_PRICE_API }}
          JAVA_TOOL_OPTIONS="-Dio.netty.noNative=true -Dreactor.netty.http.client.enableHttp3=false"
          SPRING_PROFILES_ACTIVE=prod
          EOL
          EOF

      - name: Deploy application
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/vps_key \
              -p ${{ secrets.VPS_SSH_PORT }} \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
          cd digital-trade-backend
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker compose pull
          docker compose up -d --pull always
          docker image prune -af
          EOF

  health-check:
    name: API Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for application to start
        run: |
          sleep 30

      - name: Check API health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/health || true)
          if [ "$response" != "200" ]; then
            echo "Health check failed: $response"
            exit 1
          else
            echo "Health check passed: $response"
          fi
