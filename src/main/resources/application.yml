spring:
  application:
    frontend-url: ${FRONTEND_URL}
    name: firm

    security:
      jwt:
        secret-key: ${JJWT_SECRET:change-me-in-production-this-is-only-for-local-development-demo}
        expiration: 86400000 # 1 day in milliseconds
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial version"
    locations: classpath:db/migration
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Async configuration
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 25


app:
  email:
    max-retry: 3

server:
  forward-headers-strategy: framework
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO #Error|INFO|DEBUG
    org:
      hibernate:
        SQL: INFO #Error|INFO|DEBUG
        type:
          descriptor:
            sql: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

reactor:
  netty:
    http:
      client:
        enable-http3: false

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_APIKEY}
  api-secret: ${CLOUDINARY_SECRET}

crypto:
  price-api: ${CRYPTO_PRICE_API}